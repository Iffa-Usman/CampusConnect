{% extends "base.html" %}
{% block title %}Log in | CampusConnect{% endblock %}
{% block content %}
<section class="auth-wrap"><div class="auth-card">
  <span class="eyebrow">WELCOME BACK</span><h1>Log in to CampusConnect</h1>
  <p class="muted">Enter your account details to continue.</p>
  <form method="post">
    <label>Email address</label><input id="email" name="email" type="email" placeholder="you@example.com" required>
    <label>Password</label><input id="password" name="password" type="password" placeholder="Your password" required>
    <button class="btn primary full" type="submit">Log in</button>
  </form>
  <p class="auth-bottom">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div></section>
{% endblock %}
