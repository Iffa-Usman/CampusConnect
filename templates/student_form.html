{% extends "base.html" %}
{% block title %}{{ page_title }} | CampusConnect{% endblock %}
{% block content %}
<section class="form-page">
  <a class="back-link" href="{{ url_for('dashboard') }}">← Back to dashboard</a>
  <div class="form-card">
    <span class="eyebrow">STUDENT RECORD</span><h1>{{ page_title }}</h1>
    <p class="muted">Enter the student's information below.</p>
    <form method="post">
      <div class="form-grid">
        <div class="field full-field"><label>Full name</label><input id="name" name="name" value="{{ student.name if student else '' }}" minlength="2" maxlength="60" required placeholder="e.g. Ayesha Khan"></div>
        <div class="field"><label>Email address</label><input id="email" name="email" type="email" value="{{ student.email if student else '' }}" required placeholder="student@example.com"></div>
        <div class="field"><label>Age</label><input id="age" name="age" type="number" min="16" max="100" value="{{ student.age if student else '' }}" required></div>
        <div class="field"><label>Department</label><select id="department" name="department" required>
          <option value="">Select department</option>
          {% for d in ['Software Engineering','Computer Science','Information Technology','Electrical Engineering','Business Administration','Mathematics'] %}
          <option value="{{ d }}" {% if student and student.department == d %}selected{% endif %}>{{ d }}</option>
          {% endfor %}
        </select></div>
        <div class="field"><label>Marks (0–100)</label><input id="marks" name="marks" type="number" min="0" max="100" step="0.1" value="{{ student.marks if student else '' }}" required></div>
        <div class="field full-field"><label>Status</label><select id="status" name="status"><option {% if not student or student.status == 'Active' %}selected{% endif %}>Active</option><option {% if student and student.status == 'Inactive' %}selected{% endif %}>Inactive</option></select></div>
      </div>
      <div class="actions"><button class="btn primary" type="submit">{{ 'Save changes' if student else 'Add student' }}</button><a class="btn secondary" href="{{ url_for('dashboard') }}">Cancel</a></div>
    </form>
  </div>
</section>
{% endblock %}
